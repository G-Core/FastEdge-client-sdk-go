openapi: 3.0.1

info:
  title: to be deleted
  version: 1.0.0

paths:
  /dummy:
   get:
      responses:
        200:
          description: Ok

components:
  schemas:
    app_short:
      required:
      - id
      - name
      - status
      - binary
      - api_type
      - plan_id
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: App ID
          minimum: 1
        name:
          type: string
          description: App name
        url:
          type: string
          description: App URL
        status:
          type: integer
          description: 'Status code:<br>0 - draft (inactive)<br>1 - enabled<br>2 - disabled<br>3 - hourly call limit exceeded<br>4 - daily call limit exceeded<br>5 - suspended'
        binary:
          type: integer
          format: int64
          description: Binary ID
        comment:
          type: string
          description: Description of the binary
        api_type:
          type: string
          description: Wasm API type
        debug_until:
          type: string
          format: date-time
          description: When debugging finishes
        debug:
          default: false
          description: Switch on logging for 30 minutes (switched off by default)
          type: boolean
          writeOnly: true
        template:
          type: integer
          format: int64
          description: Template ID
        template_name:
          type: string
          description: Template name
        networks:
          description: Networks
          type: array
          items:
            type: string
        upgradeable_to:
          type: integer
          format: int64
          description: ID of the binary the app can be upgraded to
        plan_id:
          type: integer
          format: int64
          description: Application plan ID
        plan:
          type: string
          description: Application plan name
    app:
      type: object
      properties:
        name:
          type: string
          description: Unique application name (alphanumeric, hyphens allowed)
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          example: "my-edge-app"
        url:
          type: string
          readOnly: true
          description: Auto-generated URL where the application is accessible
          example: "my-edge-app.fastedge.gcore.dev"
        binary:
          type: integer
          format: int64
          description: ID of the WebAssembly binary to deploy
          minimum: 1
          example: 12345
        template:
          type: integer
          format: int64
          description: Template ID
        template_name:
          readOnly: true
          type: string
          description: Template name
        status:
          type: integer
          description: 'Status code:<br>0 - draft (inactive)<br>1 - enabled<br>2 - disabled<br>5 - suspended'
          minimum: 0
          maximum: 5
          example: 1
        plan_id:
          readOnly: true
          type: integer
          format: int64
          description: Plan ID
        plan:
          readOnly: true
          type: string
          description: Plan name
        env:
          type: object
          description: Environment variables
          additionalProperties:
            type: string
          example:
            var1: value1
            var2: value2
        rsp_headers:
          type: object
          description: Extra headers to add to the response
          additionalProperties:
            type: string
          example:
            header1: value1
            header2: value2
        log:
          deprecated: true
          type: string
          nullable: true
          enum: [kafka, none]
        debug:
          type: boolean
          writeOnly: true
          description: Enable verbose debug logging for 30 minutes. Automatically expires to prevent performance impact.
          default: false
          example: false
        debug_until:
          type: string
          format: date-time
          readOnly: true
          description: When debugging finishes
        comment:
          type: string
          description: Optional human-readable description of the application's purpose
          maxLength: 1024
          example: "Production API gateway for customer portal"
        api_type:
          readOnly: true
          type: string
          description: Wasm API type
        networks:
          readOnly: true
          description: Networks
          type: array
          items:
            type: string
        secrets:
          type: object
          description: Application secrets
          additionalProperties:
            $ref: '#/components/schemas/app_secret_short'
        stores:
          type: object
          description: Application edge stores
          additionalProperties:
            $ref: '#/components/schemas/app_store'
    binary_short:
      required:
      - id
      - status
      - api_type
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Binary ID
        status:
          type: integer
          description: 'Status code:<br>0 - pending<br>1 - compiled<br>2 - compilation failed (errors available)<br>3 - compilation failed (errors not available)<br>4 - resulting binary exceeded the limit<br>5 - unsupported source language'
        unref_since:
          type: string
          description: Not used since (UTC)
        api_type:
          type: string
          description: Wasm API type
        checksum:
          type: string
          description: MD5 hash of the binary
        source:
          type: integer
          description: 'Source language:<br>0 - unknown<br>1 - Rust<br>2 - JavaScript<br>3 - Go'
          minimum: 0
          maximum: 3
    binary:
      required:
      - id
      - status
      - source
      - api_type
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Binary ID
        status:
          type: integer
          description: 'Status code:<br>0 - pending<br>1 - compiled<br>2 - compilation failed (errors available)<br>3 - compilation failed (errors not available)<br>4 - resulting binary exceeded the limit<br>5 - unsupported source language'
          minimum: 0
          maximum: 5
        source:
          type: integer
          description: 'Source language:<br>0 - unknown<br>1 - Rust<br>2 - JavaScript<br>3 - Go'
          minimum: 0
          maximum: 3
        unref_since:
          type: string
          description: Not used since (UTC)
        api_type:
          type: string
          description: Wasm API type
        checksum:
          type: string
          description: MD5 hash of the binary
    template_short:
      type: object
      required:
      - id
      - name
      - api_type
      - owned
      properties:
        id:
          type: integer
          format: int64
          description: Template ID
        name:
          type: string
          description: Name of the template
        short_descr:
          type: string
          description: Short description of the template
        long_descr:
          type: string
          description: Long description of the template
        api_type:
          type: string
          description: Wasm API type
        owned:
          type: boolean
          description: Is the template owned by user?
    template:
      type: object
      required:
      - binary_id
      - name
      - params
      - api_type
      - owned
      properties:
        binary_id:
          type: integer
          format: int64
          description: ID of the WebAssembly binary to use for this template
          example: 12345
        name:
          type: string
          description: Unique name for the template (used for identification and searching)
          minLength: 1
          maxLength: 128
          pattern: "^[a-zA-Z0-9_ -]*$"
          example: "api-gateway-template"
        short_descr:
          type: string
          description: Brief one-line description displayed in template listings
          maxLength: 255
          example: "HTTP API gateway with authentication"
        long_descr:
          type: string
          description: Detailed markdown description explaining template features and usage
          maxLength: 4096
          example: "Complete API gateway solution with JWT authentication, rate limiting, and request transformation capabilities."
        api_type:
          readOnly: true
          type: string
          description: Wasm API type
        owned:
          type: boolean
          description: Is the template owned by user?
        params:
          type: array
          description: Parameters
          items:
            $ref: '#/components/schemas/template_param'
    template_param:
      type: object
      required:
      - name
      - data_type
      - mandatory
      properties:
        name:
          type: string
          description: Parameter name used as a placeholder in template (e.g., API_KEY, DATABASE_URL)
          minLength: 1
          maxLength: 64
          example: "api_key"
        data_type:
          type: string
          description: 'Parameter type determines validation and UI rendering:<br>string - text input<br>number - numeric input<br>date - date picker<br>time - time picker<br>secret - references a secret<br>store - references an edge store<br>bool - boolean toggle<br>json - JSON editor or multiline text area with JSON validation<br>enum - dropdown/select with allowed values defined via parameter metadata'
          enum: [string, number, date, time, secret, store, bool, json, enum]
          example: "string"
        mandatory:
          type: boolean
          description: If true, this parameter must be provided when instantiating the template
          default: false
          example: true
        descr:
          type: string
          description: Human-readable explanation of what this parameter controls
          example: "API key for external service authentication"
        metadata:
          type: string
          description: Optional JSON-encoded string for additional parameter metadata, such as allowed values for enum types
    call_stats:
      type: object
      description: Edge app call statistics
      required:
      - time
      - count_by_status
      properties:
        time:
          type: string
          format: date-time
          description: Beginning ot reporting slot
        count_by_status:
          type: array
          description: Count by status
          items:
            $ref: '#/components/schemas/count_by_status'
    count_by_status:
      type: object
      required:
      - status
      - count
      properties:
        status:
          type: integer
          description: HTTP status
        count:
          type: integer
          description: Number of app calls
    duration_stats:
      type: object
      description: Edge app execution duration statistics
      required:
      - time
      - min
      - max
      - avg
      - median
      - perc75
      - perc90
      properties:
        time:
          type: string
          format: date-time
          description: Beginning of reporting slot
        min:
          type: integer
          format: int64
          description: Min duration in usec
        max:
          type: integer
          format: int64
          description: Max duration in usec
        avg:
          type: integer
          format: int64
          description: Average duration in usec
        median:
          type: integer
          format: int64
          description: Median (50% percentile) duration in usec
        perc75:
          type: integer
          format: int64
          description: 75% percentile duration in usec
        perc90:
          type: integer
          format: int64
          description: 90% percentile duration in usec
    admin_stats:
      type: object
      description: |
        Aggregated FastEdge usage statistics for one group. The group-key fields
        (client_id, app_id, region, country) are present only for the dimensions
        requested in group_by.
      required:
      - total_count
      - exec_time
      - status_counts
      properties:
        client_id:
          type: integer
          format: int64
          description: Client ID (present when grouped by client)
        app_id:
          type: integer
          format: int64
          description: Application ID (present when grouped by app)
        region:
          type: string
          description: Region (present when grouped by region)
        country:
          type: string
          description: Country (present when grouped by country)
        total_count:
          type: integer
          format: int64
          description: Total number of requests in the group
        exec_time:
          $ref: '#/components/schemas/admin_stats_exec_time'
        status_counts:
          $ref: '#/components/schemas/admin_stats_status_counts'
    admin_stats_exec_time:
      type: object
      description: Execution-time statistics in milliseconds
      required:
      - min
      - max
      - avg
      - median
      - perc75
      - perc90
      properties:
        min:
          type: number
          format: double
          description: Min execution time in ms
        max:
          type: number
          format: double
          description: Max execution time in ms
        avg:
          type: number
          format: double
          description: Average execution time in ms
        median:
          type: number
          format: double
          description: Median (50th percentile) execution time in ms
        perc75:
          type: number
          format: double
          description: 75th percentile execution time in ms
        perc90:
          type: number
          format: double
          description: 90th percentile execution time in ms
    admin_stats_status_counts:
      type: object
      description: Request counts by HTTP status class.
      required:
      - success
      - count_3xx
      - count_4xx
      - count_5xx
      properties:
        success:
          type: integer
          format: int64
          description: 'Successful requests: status 0 (for CDN apps) or 2xx'
        count_3xx:
          type: integer
          format: int64
          description: Number of 3xx responses
        count_4xx:
          type: integer
          format: int64
          description: Number of 4xx responses
        count_5xx:
          type: integer
          format: int64
          description: Number of 5xx responses
    client_short:
      type: object
      required:
      - id
      - name
      - email
      properties:
        id:
          type: integer
          format: int64
          description: Client ID
        name:
          type: string
          description: Client name
        email:
          type: string
          description: Client e-mail address
    client:
      required:
      - status
      - hourly_consumption
      - daily_consumption
      - app_count
      - monthly_consumption
      - networks
      - plan_id
      type: object
      properties:
        status:
          type: integer
          description: 'Status code:<br>1 - enabled<br>2 - disabled<br>5 - suspended'
          minimum: 1
          maximum: 5
        hourly_consumption:
          type: integer
          description: Actual number of calls for all apps during the current hour
        daily_consumption:
          type: integer
          description: Actual number of calls for all apps during the current day (UTC)
        app_count:
          type: integer
          description: Actual allowed number of apps
        monthly_consumption:
          type: integer
          description: Actual number of calls for all apps during the current calendar month (UTC)
        networks:
          type: array
          description: List of enabled networks
          items:
            $ref: '#/components/schemas/network'
        plan_id:
          type: integer
          format: int64
          description: Plan ID
        plan:
          readOnly: true
          type: string
          description: Plan name
    secret_short:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "The unique identifier of the secret."
        name:
          type: string
          description: "The unique name of the secret."
        comment:
          type: string
          description: "A description or comment about the secret."
        app_count:
          type: integer
          format: int
          description: "The number of applications that use this secret."
          readOnly: true
      required:
        - name
    app_secret_short:
      type: object
      description: Application secret short description
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          description: "The unique identifier of the secret."
        name:
          type: string
          readOnly: true
          description: "The unique name of the secret."
        comment:
          type: string
          readOnly: true
          description: "A description or comment about the secret."
    secret_slot:
      type: object
      properties:
        slot:
          type: integer
          format: int64
          description: "Unix timestamp (seconds since epoch) indicating when this secret version becomes active. Use for time-based secret rotation."
          example: 1704067200
        value:
          type: string
          description: "The plaintext secret value. Will be encrypted with AES-256-GCM before storage."
          writeOnly: true
          maxLength: 4096
          example: "P@ssw0rd123!"
        checksum:
          type: string
          description: "SHA-256 hash of the decrypted value for integrity verification (auto-generated)"
          readOnly: true
          example: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
      required:
        - slot
    secret:
      type: object
      properties:
        name:
          type: string
          description: "The unique name of the secret."
          minLength: 1
          maxLength: 128
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]*[a-zA-Z0-9]$"
        comment:
          type: string
          description: "A description or comment about the secret."
          maxLength: 1024
        app_count:
          type: integer
          format: int
          description: "The number of applications that use this secret."
          readOnly: true
        secret_slots:
          type: array
          description: "A list of secret slots associated with this secret."
          items:
            $ref: "#/components/schemas/secret_slot"
    log:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for this log entry
        app_name:
          type: string
          description: Name of the application that generated this log
        timestamp:
          type: string
          format: date-time
          description: When the log was generated (RFC3339 format)
        log:
          type: string
          description: The actual log message content
        edge:
          type: string
          description: Edge location where the log originated
        client_ip:
          type: string
          description: IP address of the client that triggered the log
        request_id:
          type: string
          description: Request ID
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Error message
    conflictError:
      type: object
      required:
        - error
        - conflicting_ids
      properties:
          error:
              type: string
              description: Error message
          conflicting_ids:
              type: array
              items:
                  type: integer
                  format: int64
              description: List of conflicting entity IDs
    network:
      type: object
      required:
      - name
      - is_default
      properties:
        name:
          type: string
          description: Network name
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9_-]*[a-z0-9]$"
        is_default:
          type: boolean
          description: Is network is default
    plan:
      required:
      - max_duration
      - mem_limit
      - max_subrequests
      - reseller_id
      - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Plan ID
        max_duration:
          type: integer
          description: Maximum execution time per request in milliseconds. Requests exceeding this limit are terminated.
          minimum: 1
          example: 50
        mem_limit:
          type: integer
          description: Maximum memory allocation per instance in bytes. Prevents runaway memory usage.
          example: 10485760
        max_subrequests:
          type: integer
          deprecated: true
          description: Maximum number of outgoing HTTP requests allowed per invocation (0 disables external requests)
        billing_plan_id:
          type: integer
          format: int64
          description: Billing plan ID
          default: 0
        reseller_id:
          type: integer
          format: int64
          description: Reseller plan ID
          default: 0
        name:
          type: string
          description: Unique plan identifier (alphanumeric and hyphens)
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]$"
          example: "enterprise-tier"
        cache_mode:
          type: integer
          description: 'Caching mode:<br>0 - no caching<br>1 - client-scoped caching<br>2 - app-scoped caching'
          enum: [0, 1, 2]
          default: 0
          writeOnly: true
          x-go-type-skip-optional-pointer: true
    clientUpdate:
      type: object
      required:
      - plan_id
      - networks
      properties:
        plan_id:
          type: integer
          format: int64
          description: Plan ID
        networks:
          type: array
          description: List of available networks
          items:
            type: string
    prebillingConsumptionData:
      type: object
      properties:
        client_id:
          type: integer
        date:
          type: string
          format: date
        subproduct:
          type: string
        metric_value:
          type: integer
        metric_unit:
          type: string
        metric_name:
          type: string
    prebillingConsumptionPagination:
      type: object
      properties:
        total_pages:
          type: integer
          format: int32
        current_page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    prebillingConsumptionResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/prebillingConsumptionPagination'
        data:
          type: array
          items: 
            $ref: '#/components/schemas/prebillingConsumptionData'
    prebillingMetric:
      type: object
      properties:
        number_of_calls:
          type: integer
          format: int64
          description: Number of app calls
        exec_time:
          type: integer
          format: int64
          description: Total app execution time, in seconds
        total_runtime_mms:
          type: number
          deprecated: true
          description: Total app execution time, in million milliseconds (1000 seconds) units
        kv_read_count:
          type: integer
          format: int64
          description: Number of read operations
        kv_write_size:
          type: integer
          format: int64
          description: Volume of write operations, in bytes
        kv_storage_size:
          type: number
          format: double
          description: Storage size used over time, in MB*hours
        kv_del_count:
          type: integer
          format: int64
          description: Number of delete operations
    kvStoreStats:
      type: object
      required:
        - read_count
        - write_size
        - storage_size
        - del_count
      properties:
        time:
          type: string
          format: date-time
          description: Beginning of reporting slot
        read_count:
          type: integer
          format: int64
          description: Number of read operations
        write_size:
          type: integer
          format: int64
          description: Volume of write operations, in bytes
        storage_size:
          type: number
          format: double
          description: Storage size used over time, in MB*hours
        del_count:
          type: integer
          format: int64
          description: Number of delete operations
    prebillingObject:
      type: object
      required:
        - metrics
      properties:
        metrics:
          type: object
          $ref: '#/components/schemas/prebillingMetric'
        client:
          type: integer
          format: int64
        billing_plan:
          type: string 
        region:
          type: string
        date:
          type: string
          format: date
    prebillingResponse:
      type: array
      items:
        $ref: '#/components/schemas/prebillingObject'
    group_short:
      type: object
      required:
      - id
      - name
      - default_flag
      properties:
        id:
          type: integer
          format: int64
          description: Group ID
        name:
          type: string
          description: Group name
        default_flag:
          type: boolean
          description: Add new members to the group by default
          default: false
        descr:
          type: string
          description: Group description
          example: "Video streaming customers"
        client_count:
          type: integer
          description: Number of members in the group
        template_count:
          type: integer
          description: Number of templates in the group
    group:
      type: object
      required:
      - name
      - default_flag
      properties:
        name:
          type: string
          description: Group name
          minLength: 1
          maxLength: 128
        default_flag:
          type: boolean
          description: Add new members to the group by default
          default: false
        descr:
          type: string
          description: Group description
          example: "Video streaming customers"
    app_short_admin:
      type: object
      allOf:
        - $ref: '#/components/schemas/app_short'
        - type: object
          required:
            - client_id
            - reseller_id
          properties:
            client_id:
              type: integer
              format: int64
              description: Client ID
            reseller_id:
              type: integer
              format: int64
              description: Reseller ID
              nullable: true
    template_short_admin:
      type: object
      allOf:
        - $ref: '#/components/schemas/template_short'
        - type: object
          required:
            - client_id
            - reseller_id
            - groups
          properties:
            client_id:
              type: integer
              format: int64
              description: Client ID
            reseller_id:
              type: integer
              format: int64
              description: Reseller ID
              nullable: true
            groups:
              type: array
              description: Groups the template is shared to
              items:
                type: integer
                format: int64
    kv_store_short:
      type: object
      required:
      - id
      - name
      - app_count
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier of the store
          readOnly: true
          x-go-type-skip-optional-pointer: true
        name:
          type: string
          description: A name of the store
        comment:
          type: string
          description: A description of the store
        app_count:
          type: integer
          description: The number of applications that use this store
          x-omitempty: false
        size:
          type: integer
          format: int64
          description: Total store size in bytes
    kv_store:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: A name of the store
        comment:
          type: string
          description: A description of the store
        app_count:
          type: integer
          description: The number of applications that use this store
          readOnly: true
          x-go-type-skip-optional-pointer: true
          x-omitempty: false
        byod:
          type: object
          $ref: '#/components/schemas/byod'
        size:
          type: integer
          format: int64
          description: Total store size in bytes (zero for BYOD stores)
          readOnly: true
          x-go-type-skip-optional-pointer: true
          x-omitempty: false
        revision:
          type: integer
          format: int64
          description: Current store revision (only for non-BYOD stores)
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Timestamp of last store revision (only for non-BYOD stores)
          readOnly: true
    byod:
      type: object
      description: BYOD (Bring Your Own Data) settings
      required:
        - url
        - prefix
      properties:
        url:
          type: string
          description: Connection URL for external storage service (Redis, PostgreSQL, etc.)
          example: "redis://redis.example.com:6379/0"
        prefix:
          type: string
          description: Key prefix to namespace your data within the external store
          example: "app:prod:"
    store_entry_short:
      type: object
      description: Edge store entry
      required:
        - key
        - datatype
      properties:
        key:
          type: string
          description: Key of the item
          minLength: 1
          maxLength: 256
        datatype:
          $ref: '#/components/schemas/kv_datatype'
        payload:
          $ref: '#/components/schemas/store_kv_pair_value'
    modify_store_data_entry:
      type: object
      allOf:
      - $ref: '#/components/schemas/store_entry'
      - type: object
        required:
        - op
        properties:
          op:
            $ref: '#/components/schemas/store_entry_op'
    store_entry:
      type: object
      description: Edge store entry
      required:
        - key
        - datatype
      properties:
        key:
          type: string
          description: Key of the item
          minLength: 1
          maxLength: 256
        datatype:
          $ref: '#/components/schemas/kv_datatype'
        payload:
          anyOf:
          - $ref: '#/components/schemas/store_kv_pair_value'
          - $ref: '#/components/schemas/store_sorted_set'
          - $ref: '#/components/schemas/store_bloom_filter'
    store_entry_op:
      type: string
      description: Data operation
      enum: [add, del_key, del_entries]
    store_kv_pair_value:
      type: object
      description: KV pair value
      allOf:
      - $ref: '#/components/schemas/encoded_value'
      - type: object
        properties:
          expiry:
            type: string
            description: Optional expiration timestamp in RFC3339 format. Entry is automatically deleted after this time.
            example: "2024-12-31T23:59:59Z"
    store_sorted_set:
      type: array
      description: Sorted set items
      items:
        $ref: '#/components/schemas/store_sorted_set_item'
    store_sorted_set_item:
      type: object
      description: Sorted set item
      required:
      - value
      allOf:
      - $ref: '#/components/schemas/encoded_value'
      - type: object
        properties:
          score:
            type: number
            format: double
            description: Numeric score for sorted set ranking. Lower scores appear first in sorted queries. Not required for delete operations.
            example: 42.5
    store_bloom_filter:
      type: array
      description: Bloom filter
      items:
        $ref: '#/components/schemas/encoded_value'
    kv_datatype:
      type: string
      description: Data type of the item
      enum: [kv, sorted_set, bloom_filter]
    encoded_value:
      type: object
      description: Value with encoding
      required:
        - value
      properties:
        value:
          type: string
          description: Data value, encoded according to the specified encoding method (see 'encoding' field)
          maxLength: 1048576
          example: "John Doe"
        encoding:
          type: string
          description: 'Value encoding method:<br>plain - unencoded text<br>base64 - base64-encoded binary data<br>sha256 - SHA-256 hash (output only), for fields larger than 1024 bytes'
          enum: [plain, base64, sha256]
          default: plain
          x-go-type-skip-optional-pointer: true
          example: "plain"
    app_store:
      type: object
      description: Application stores
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
          description: The identifier of the store
        name:
          type: string
          readOnly: true
          x-go-type-skip-optional-pointer: true
          description: The name of the store
        comment:
          type: string
          readOnly: true
          description: A description of the store

